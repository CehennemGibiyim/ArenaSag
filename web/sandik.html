<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Sandık Radarı — GitHub Pages</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 12% -10%,rgba(37,244,238,.14),transparent),radial-gradient(700px 500px at 88% 0%,rgba(254,44,85,.16),transparent),#050509;color:#eef0fa;font-family:Inter,'Segoe UI',system-ui,sans-serif;padding:24px 16px}.wrap{max-width:1180px;margin:0 auto}.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2em;font-size:12px}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#25f4ee,#fe2c55);display:grid;place-items:center;color:#05060a;font-weight:900}input,select{background:#0a0b12;border:1px solid rgba(255,255,255,.12);color:#eef0fa;border-radius:9px;padding:7px 10px;font-size:12px;font-family:inherit}button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#eef0fa;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}button.on{border-color:rgba(37,244,238,.5);background:rgba(37,244,238,.12);color:#9df9f5}.status{margin:12px 0 4px;font-size:11px;color:rgba(238,240,250,.45)}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:12px}.card{border:1px solid rgba(255,255,255,.1);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border-radius:14px;padding:13px}.card.open{border-color:rgba(254,44,85,.45)}.card.gold{border-color:rgba(245,182,66,.4)}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.who{font-size:13px;font-weight:700}.sub{font-size:10px;color:rgba(238,240,250,.4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.timer{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.m{border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:5px;text-align:center;background:rgba(0,0,0,.25)}.m b{display:block;font-size:13px;font-variant-numeric:tabular-nums}.m span{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:rgba(238,240,250,.35)}a.open-live{display:block;margin-top:9px;text-align:center;padding:8px;border-radius:9px;background:linear-gradient(100deg,#25f4ee,#7c5cff,#fe2c55);color:#05060a;font-weight:800;font-size:11.5px;text-decoration:none}.empty{padding:40px;text-align:center;color:rgba(238,240,250,.4);font-size:12px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tabs button{font-size:11px;padding:5px 9px}.err{color:#ff9eb2;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="logo"><span class="mark">A</span> ARENA SANDIK RADARI</div><div style="display:flex;gap:6px;flex-wrap:wrap"><input id="api" placeholder="Panel adresi" style="width:230px" /><input id="q" placeholder="Yayıncı ara" style="width:130px" /><select id="sort"><option value="opens_at">Açılış</option><option value="coins">Jeton</option><option value="ratio">Oran</option><option value="per_slot">Kişi başı</option><option value="viewers">İzleyici</option></select><button id="dir">↓</button><button id="refresh">↻</button></div></div>
<div class="tabs" id="tabs"></div><div class="status" id="status">yükleniyor…</div><div class="err" id="err"></div><div class="grid" id="grid"></div>
</div>
<script>
var API = localStorage.getItem("arenaApi") || window.ARENA_API_BASE || "http://localhost:3000";
var state = { tab: "chest", q: "", sort: "opens_at", desc: true, chests: [], flows: [], tabs: [] };
var apiInput = document.getElementById("api"), qInput = document.getElementById("q"), sortInput = document.getElementById("sort"), dirBtn = document.getElementById("dir");
apiInput.value = API;
function fmt(n){ n=Number(n)||0; if(n>=1e6)return (n/1e6).toFixed(1)+"M"; if(n>=1e3)return (n/1e3).toFixed(n%1e3===0?0:1)+"K"; return new Intl.NumberFormat("tr-TR").format(n); }
function clock(s){ s=Math.max(0,Math.round(s)); if(s<60)return s+"s"; var m=Math.floor(s/60); if(m<60)return m+":"+String(s%60).padStart(2,"0"); return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"); }
function color(s){ return s<=0?"#ff3b5c":s<=30?"#ffa62b":"#2ee6a8"; }
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function renderTabs(counts){ var el=document.getElementById("tabs"); el.innerHTML=""; (state.tabs.length?state.tabs:[{id:"chest",label:"Sandık",filter:{kind:"chest"}},{id:"flow",label:"Jeton akışı",filter:{kind:"live"}}]).forEach(function(tab){ var b=document.createElement("button"); b.textContent=tab.label+" ("+(counts&&counts[tab.id]!=null?counts[tab.id]:0)+")"; if(state.tab===tab.id)b.className="on"; b.onclick=function(){state.tab=tab.id;load();}; el.appendChild(b); }); }
function currentTab(){ return state.tabs.find(function(t){return t.id===state.tab;}) || {filter:{kind:"chest"}}; }
function render(){ var grid=document.getElementById("grid"), tab=currentTab(), rows=(state.tab==="flow"||(tab.filter&&tab.filter.kind==="live"))?state.flows:state.chests; if(state.q) rows=rows.filter(function(r){return (r.username+" "+(r.nickname||"")+" "+(r.title||"")).toLowerCase().indexOf(state.q.toLowerCase())>=0;}); grid.innerHTML=""; if(!rows.length){grid.innerHTML='<div class="empty">Uygun sandık yok — panelde tarama başlatın.</div>';return;} rows.forEach(function(r){ var isFlow=r.kind==="live", left=isFlow?0:Math.round((new Date(r.opensAt||Date.now()).getTime()-Date.now())/1000), el=document.createElement("div"); el.className="card"+(!isFlow&&left<=0?" open":"")+(r.variant==="gold"?" gold":""); el.innerHTML='<div class="row"><div style="min-width:0"><div class="who">@'+esc(r.username)+'</div><div class="sub">'+esc(r.title||(isFlow?"jeton akışı":r.variant))+'</div></div><div style="text-align:right"><div class="timer" style="color:'+(isFlow?"#2ee6a8":color(left))+'">'+(isFlow?"●":(left>0?clock(left):"●"))+'</div><div class="sub">'+(isFlow?"canlı":(left>0?"açılış":"açık"))+'</div></div></div><div class="metrics"><div class="m"><b>'+fmt(r.coins)+'</b><span>Jeton</span></div><div class="m"><b style="color:#9df9f5">'+(r.ratio||0)+'</b><span>Oran</span></div><div class="m"><b>'+fmt(r.slots)+'</b><span>'+(isFlow?"Gönderen":"Kontenjan")+'</span></div></div><div class="sub" style="margin-top:7px">'+fmt(r.viewers)+' izleyici'+(isFlow?"":" · katılan "+fmt(r.joined))+'</div><a class="open-live" href="https://www.tiktok.com/@'+esc(r.username)+'/live" target="_blank" rel="noreferrer">CANLI\'yı Aç</a>'; grid.appendChild(el); }); }
async function load(){ var tab=currentTab(), params=new URLSearchParams(); Object.keys(tab.filter||{}).forEach(function(k){ var v=tab.filter[k]; params.set(k,Array.isArray(v)?v.join(","):v); }); params.set("sort",state.sort); params.set("desc",state.desc?"1":"0"); if(state.q)params.set("q",state.q); try{ var res=await fetch(API+"/api/chests?"+params.toString(),{cache:"no-store"}); if(!res.ok)throw new Error("HTTP "+res.status); var data=await res.json(); state.chests=data.chests||[]; state.flows=data.flows||[]; if(data.tabs&&data.tabs.length)state.tabs=data.tabs; renderTabs(data.tab_counts||{}); render(); document.getElementById("status").textContent=(data.count||0)+" sandık · "+state.flows.length+" akış odası · "+new Date().toLocaleTimeString("tr-TR"); document.getElementById("err").textContent=""; }catch(e){ document.getElementById("err").textContent="Bağlantı yok: "+e.message+" — paneli başlatın veya API adresini girin."; } }
apiInput.onchange=function(){API=apiInput.value.replace(/\/$/,"");localStorage.setItem("arenaApi",API);load();};
qInput.oninput=function(){state.q=qInput.value;render();};
sortInput.onchange=function(){state.sort=sortInput.value;load();};
dirBtn.onclick=function(){state.desc=!state.desc;dirBtn.textContent=state.desc?"↓":"↑";load();};
document.getElementById("refresh").onclick=load; setInterval(load,15000); setInterval(render,1000); load();
</script>
</body>
</html>
