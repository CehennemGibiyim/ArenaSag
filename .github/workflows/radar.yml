name: Arena Radar Scan

on:
  schedule:
    # GitHub en kısa 5 dakikalık aralığı destekler; yoğunlukta birkaç dakika gecikebilir.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar-publish.mjs"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: arena-radar
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Veri dalını hazırla
        run: |
          set -euo pipefail
          mkdir -p web/data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            for name in arena-live.json roster.json version.json; do
              git show "FETCH_HEAD:web/data/$name" > "web/data/$name" 2>/dev/null || rm -f "web/data/$name"
            done
            echo "Önceki veri $DATA_BRANCH dalından alındı."
          else
            echo "Veri dalı henüz yok; ilk tarama oluşturacak."
          fi

      - name: Canlı yayın ve sandık taraması
        env:
          ARENA_MAX_CHECKS: "80"
          ARENA_MAX_ROOMS: "45"
          ARENA_DATA_BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          # Dakika başında aynı saniyeye yüklenmemek için kısa rastgele gecikme.
          sleep $((RANDOM % 30))
          node scripts/radar-publish.mjs

      - name: Veriyi veri dalına işle
        id: publish
        run: |
          set -euo pipefail
          staged="$(mktemp -d)"
          for name in arena-live.json roster.json version.json; do
            if [ -f "web/data/$name" ]; then cp "web/data/$name" "$staged/$name"; fi
          done
          git config user.name "arena-radar[bot]"
          git config user.email "arena-radar@users.noreply.github.com"
          # .gitignore veriyi ana dalda yasaklar; dal değişiminden önce temizle
          rm -f web/data/*.json
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git checkout -B "$DATA_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -r --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p web/data
          for name in arena-live.json roster.json version.json; do
            if [ -f "$staged/$name" ]; then cp "$staged/$name" "web/data/$name"; fi
          done
          # -f: veri dalında .gitignore geçerli olsa da dosyalar izlenmeli
          git add -f web/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Veri değişmedi."
          else
            git commit -m "chore(radar): canlı tarama verisi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$DATA_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scan
    if: needs.scan.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: arena-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Veriyi yayına ekle
        run: |
          set -euo pipefail
          mkdir -p web/data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            for name in arena-live.json roster.json version.json; do
              git show "FETCH_HEAD:web/data/$name" > "web/data/$name" 2>/dev/null || rm -f "web/data/$name"
            done
          fi

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Web kütüphanesini yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          # v5 varsayılan olarak gizli dosyaları atlar; web/.nojekyll korunmalı.
          include-hidden-files: true

      # upload-pages-artifact başarılı olsa da artefakt birkaç saniye görünmeyebiliyor;
      # deploy-pages o anda "No artifacts named github-pages" ile düşüyordu.
      - name: Yayın paketinin görünmesini bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')"
            if [ "${count:-0}" -gt 0 ]; then
              echo "github-pages artefaktı hazır (deneme ${attempt})."
              exit 0
            fi
            sleep 3
          done
          echo "github-pages artefaktı 60 saniye içinde görünmedi." >&2
          exit 1

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
