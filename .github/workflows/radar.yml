name: Arena Radar Scan

on:
  schedule:
    # 10 dakikalık kadans: koşu sayısını yarıya indirir. Yayın ayrıca
    # scripts/data-changed.mjs kararına bağlıdır (anlamlı değişiklik yoksa atlanır).
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar-publish.mjs"
      - "scripts/envelope-watch.mjs"
      - "scripts/envelope-shard.mjs"
      - "scripts/envelope-shards.mjs"
      - "scripts/radar-notify.mjs"
      - "scripts/radar-contract.mjs"
      - "scripts/supabase-mirror.mjs"
      - "scripts/data-changed.mjs"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  issues: write

concurrency:
  group: arena-radar
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  # Matris zarf dinlemesi: her runner kendi IP'si ve kendi ücretsiz imzalama
  # kotasıyla yalnızca kendine düşen odaları dinler, sonucu artifact bırakır.
  # Ücretsiz kota bağlantı sayısını sınırlar; kısa bağlantı daha çok oda
  # bağlamadığı için ücretsiz modda 4 × 15 = 60 oda bağlanır ve kalan pencere
  # odada dinlemeye ayrılır. Anahtarlı modda 4 × 30 = 120 oda tam pencere dinlenir;
  # `--hold` yalnızca gerektiğinde bağlantı süresini kısaltan isteğe bağlı sınırdır.
  # arena-live.json'a yalnızca birleştirme işi (`scan`) yazar.
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: WebSocket istemcisini kur
        run: >
          npm install --no-save --package-lock=false --no-audit --no-fund
          tiktok-live-connector@2.5.0 tiktok-live-api-sdk@0.4.0-beta1

      # Dinlenecek odalar önceki yayından alınır: shard'lar birbirini beklemeden
      # paralel başlar ve aynı listeyi farklı dilimlerde dinler.
      - name: Dinlenecek odaları al
        run: |
          set -euo pipefail
          mkdir -p web/data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git show "FETCH_HEAD:web/data/arena-live.json" > web/data/arena-live.json 2>/dev/null \
              || rm -f web/data/arena-live.json
            echo "Önceki canlı oda listesi alındı."
          else
            echo "Veri dalı yok; bu shard dinleyecek oda bulamayacak (birleştirme yine çalışır)."
          fi

      - name: Zarf dinle
        env:
          # Anahtar tanımlıysa shard kotası yükselir; tanımlı değilse kendi IP'sinin
          # ücretsiz kotasıyla döner (reddedilen oda bekletilip yeniden denenir).
          EULER_API_KEY: ${{ secrets.EULER_API_KEY }}
          # Bildirim yakalama anında bu runner'dan gider; adres yalnızca secret'tan.
          ARENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ARENA_TELEGRAM_BOT_TOKEN }}
          ARENA_TELEGRAM_CHAT_ID: ${{ secrets.ARENA_TELEGRAM_CHAT_ID }}
          ARENA_DISCORD_WEBHOOK_URL: ${{ secrets.ARENA_DISCORD_WEBHOOK_URL }}
        run: |
          sleep $((RANDOM % 20))
          # Ücretsiz kota bağlantı sayısını sınırlıyor: az oda bağlayıp kalan
          # pencereyi dinlemeye ayır. Anahtar varsa daha çok oda bağlanır.
          rooms=15
          if [ -n "${EULER_API_KEY:-}" ]; then
            rooms=30
          fi
          node scripts/envelope-shard.mjs \
            --shard ${{ matrix.shard }} --shards 4 \
            --rooms "$rooms" --batch 5 --seconds 300 \
            --from web/data/arena-live.json \
            --out "web/data/envelope-shard-${{ matrix.shard }}.json"

      - name: Dinleme sonucunu artifact bırak
        uses: actions/upload-artifact@v4
        with:
          name: envelope-shard-${{ matrix.shard }}
          path: web/data/envelope-shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: shard
    # Bir shard düşse de yayın durmasın: artifact'ı olan odalar birleştirilir.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # WebSocket zarf dinleyicisi için gerekli iki paket; tam `npm ci` gerekmez.
      - name: WebSocket istemcisini kur
        run: >
          npm install --no-save --package-lock=false --no-audit --no-fund
          tiktok-live-connector@2.5.0 tiktok-live-api-sdk@0.4.0-beta1

      - name: Veri dalını hazırla
        run: |
          set -euo pipefail
          mkdir -p web/data
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            for name in arena-live.json roster.json version.json; do
              git show "FETCH_HEAD:web/data/$name" > "web/data/$name" 2>/dev/null || rm -f "web/data/$name"
            done
            echo "Önceki veri $DATA_BRANCH dalından alındı."
          else
            echo "Veri dalı henüz yok; ilk tarama oluşturacak."
          fi

      - name: Matris dinleme sonuçlarını indir
        uses: actions/download-artifact@v4
        with:
          pattern: envelope-shard-*
          # Artifact'lar alt klasöre değil doğrudan shards/ içine insin;
          # birleştirme `envelope-shard-*.json` dosyalarını orada arıyor.
          merge-multiple: true
          path: web/data/shards
        # Hiç shard artifact'ı yoksa birleştirme yine çalışır; eksiklik
        # `warnings` alanında açıkça görünür (sessiz yutulmaz).
        continue-on-error: true

      - name: Canlı yayın ve sandık taraması
        env:
          # Sandık, tek turda 45 oda görülerek yakalanamaz: 1000 aday doğrulanır,
          # her turda 420 canlı oda taranır ve bu tur 6 kez tekrarlanır.
          ARENA_MAX_CHECKS: "1000"
          ARENA_MAX_ROOMS: "420"
          ARENA_MAX_STREAMS: "300"
          ARENA_CHEST_ROUNDS: "6"
          ARENA_CHEST_ROUND_GAP: "30"
          ARENA_BUDGET_SECONDS: "780"
          ARENA_VERIFY_CONCURRENCY: "10"
          ARENA_ROOM_CONCURRENCY: "12"
          # WebSocket dinlemesi matris işinde yapıldı; burada yalnızca artifact'lar
          # birleştirilir ve `room/info` turları sürer. Yerel dinleyici kapalı ki
          # aynı odalar için imzalama kotası ikinci kez harcanmasın.
          ARENA_SHARD_DIR: web/data/shards
          ARENA_ENVELOPE_ROOMS: "0"
          # Tanımlıysa WebSocket imzalaması anahtarla yapılır (60 odanın tamamı
          # dinlenir). Tanımlı değilse ücretsiz imzalama ~dakikada birkaç odaya
          # izin verir ve dinleyici sınırı görünce durur.
          EULER_API_KEY: ${{ secrets.EULER_API_KEY }}
          # Tanımlıysa üye defteri ve sandık geçmişi Supabase'e de yazılır;
          # tanımlı değilse adım sessizce atlanır.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Zarf yakalandığı anda Telegram/Discord bildirimi. Adres yalnızca
          # secret'tan gelir, hiçbir dosyaya yazılmaz; tanımlı değilse bildirim
          # kapalı kalır ve koşu tek satır neden yazar.
          ARENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ARENA_TELEGRAM_BOT_TOKEN }}
          ARENA_TELEGRAM_CHAT_ID: ${{ secrets.ARENA_TELEGRAM_CHAT_ID }}
          ARENA_DISCORD_WEBHOOK_URL: ${{ secrets.ARENA_DISCORD_WEBHOOK_URL }}
          ARENA_DATA_BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          # Dakika başında aynı saniyeye yüklenmemek için kısa rastgele gecikme.
          sleep $((RANDOM % 30))
          node scripts/radar-publish.mjs

      - name: Veriyi veri dalına işle
        id: publish
        run: |
          set -euo pipefail
          staged="$(mktemp -d)"
          for name in arena-live.json roster.json version.json; do
            if [ -f "web/data/$name" ]; then cp "web/data/$name" "$staged/$name"; fi
          done
          # Dal değişiminde scripts/ kaybolur; karar betiğini önceden geçici klasöre al.
          cp scripts/data-changed.mjs "$staged/data-changed.mjs"
          git config user.name "arena-radar[bot]"
          git config user.email "arena-radar@users.noreply.github.com"
          # .gitignore veriyi ana dalda yasaklar; dal değişiminden önce temizle.
          # Shard artifact'ları veri dalına commit edilmez.
          rm -rf web/data/shards
          rm -f web/data/*.json
          branch_exists="false"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            branch_exists="true"
            git fetch --depth=1 origin "$DATA_BRANCH"
            git checkout -B "$DATA_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -r --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p web/data
          changed="true"
          if [ "$branch_exists" = "true" ] && [ -f web/data/arena-live.json ]; then
            changed="$(node "$staged/data-changed.mjs" --prev web/data --next "$staged")"
          fi
          if [ "$changed" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Anlamlı değişiklik yok; commit ve yayın atlandı."
            exit 0
          fi
          for name in arena-live.json roster.json version.json; do
            if [ -f "$staged/$name" ]; then cp "$staged/$name" "web/data/$name"; fi
          done
          # -f: veri dalında .gitignore geçerli olsa da dosyalar izlenmeli
          git add -f web/data
          git commit -m "chore(radar): canlı tarama verisi $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin "$DATA_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tarama verisini deploy işine aktar
        uses: actions/upload-artifact@v4
        with:
          name: radar-data
          path: web/data/*.json
          retention-days: 1
          if-no-files-found: error

      - name: Önceki uyarı kaydını kapat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh issue list --label radar-alert --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Radar yeniden başarılı çalıştı: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  deploy:
    needs: scan
    if: needs.scan.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arena-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Tarama verisini indir
        uses: actions/download-artifact@v4
        with:
          name: radar-data
          path: web/data

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Web kütüphanesini yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          # v5 varsayılan olarak gizli dosyaları atlar; web/.nojekyll korunmalı.
          include-hidden-files: true

      # upload-pages-artifact başarılı olsa da artefakt birkaç saniye görünmeyebiliyor;
      # deploy-pages o anda "No artifacts named github-pages" ile düşüyordu.
      - name: Yayın paketinin görünmesini bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')"
            if [ "${count:-0}" -gt 0 ]; then
              echo "github-pages artefaktı hazır (deneme ${attempt})."
              exit 0
            fi
            sleep 3
          done
          echo "github-pages artefaktı 60 saniye içinde görünmedi." >&2
          exit 1

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5

  alert:
    needs: [scan, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Uyarı kaydı aç veya güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create radar-alert --color B60205 --description "Radar koşusu uyarıları" >/dev/null 2>&1 || true
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Radar koşusu başarısız oldu (${GITHUB_EVENT_NAME}). Ayrıntı: ${run_url}"
          number="$(gh issue list --label radar-alert --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Radar koşusu başarısız" --body "$body" --label radar-alert
          fi
