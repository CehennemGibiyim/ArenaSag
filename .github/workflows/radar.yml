name: Arena Radar Scan

on:
  schedule:
    # GitHub en kısa 5 dakikalık aralığı destekler; yoğunlukta birkaç dakika gecikebilir.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar-publish.mjs"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arena-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canlı yayın ve sandık taraması
        env:
          ARENA_MAX_CHECKS: "80"
          ARENA_MAX_ROOMS: "45"
        run: node scripts/radar-publish.mjs

      - name: Veriyi depoya işle
        id: commit
        run: |
          git config user.name "arena-radar[bot]"
          git config user.email "arena-radar@users.noreply.github.com"
          git add web/data/arena-live.json web/data/version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Veri değişmedi."
          else
            git commit -m "chore(radar): canlı tarama verisi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scan
    if: needs.scan.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: arena-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Web kütüphanesini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
