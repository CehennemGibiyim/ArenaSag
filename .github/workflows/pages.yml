name: Deploy Arena Web Library
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: arena-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Radar verisini ekle
        run: |
          set -euo pipefail
          mkdir -p web/data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for name in arena-live.json roster.json version.json; do
              git show "FETCH_HEAD:web/data/$name" > "web/data/$name" 2>/dev/null || rm -f "web/data/$name"
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          # v5 varsayılan olarak gizli dosyaları atlar; web/.nojekyll korunmalı.
          include-hidden-files: true
      - name: Yayın paketinin görünmesini bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')"
            if [ "${count:-0}" -gt 0 ]; then
              echo "github-pages artefaktı hazır (deneme ${attempt})."
              exit 0
            fi
            sleep 3
          done
          echo "github-pages artefaktı 60 saniye içinde görünmedi." >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
