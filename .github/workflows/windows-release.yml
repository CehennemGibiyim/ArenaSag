name: Windows Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit push
      - run: npm run build
      - name: Windows paketini oluştur
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:TEMP "Arena-Live-OS-windows"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $dirs = @("src","public","scripts","docs","web",".github","agent",".next")
          foreach ($d in $dirs) { if (Test-Path $d) { Copy-Item $d (Join-Path $stage $d) -Recurse -Force } }
          $files = @("package.json","package-lock.json","tsconfig.json","next.config.ts","postcss.config.mjs","eslint.config.mjs","drizzle.config.json",".env.example","KURULUM.bat","Arena-Live-OS.bat","Arena-Update.bat","Durdur.bat","README.md","version.json")
          foreach ($f in $files) { if (Test-Path $f) { Copy-Item $f (Join-Path $stage $f) -Force } }
          $zip = "Arena-Live-OS-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Item $zip, SHA256SUMS.txt | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Arena-Live-OS-windows
          path: |
            Arena-Live-OS-windows.zip
            SHA256SUMS.txt
      - name: GitHub Release yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Arena-Live-OS-windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
