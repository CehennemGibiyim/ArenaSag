name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arena_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci

    - name: Birim testleri (sandık kuralları)
      run: npm run test:unit

    # Gerçek WebcastEnvelopeMessage karesi (maskelenmiş fixture) → sandık kaydı.
    # Kotasız ve çevrimdışı; canlı dinleyiciye ihtiyaç duymaz.
    - name: Zarf replay testi
      run: node --test tests/envelope-replay.test.mjs

    - name: PostgreSQL scheduler smoke test
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/arena_smoke
      run: npm run test:postgres

    - name: Run build
      run: npm run build --if-present
